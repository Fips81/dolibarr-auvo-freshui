name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # Pinned by SHA (supply chain): v7.0.1 (Node 24)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint PHP
        run: |
          php -v
          find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "PHP lint OK"

      - name: Check JavaScript syntax
        run: |
          node --version
          for f in js/*.js; do node --check "$f"; done
          echo "JS syntax OK"
